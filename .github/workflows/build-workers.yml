name: Build serverless workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/build-workers.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # voxcpm builds from the repository root so the identical Dockerfile also
        # works in Runpod's console GitHub builder, which sets that context itself.
        include:
          - worker: breeze
            context: workers/breeze
          - worker: higgs
            context: workers/higgs
          - worker: voxcpm
            context: .
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: workers/${{ matrix.worker }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.worker }}-worker:latest
            ghcr.io/${{ github.repository }}/${{ matrix.worker }}-worker:${{ github.sha }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.worker }}
          cache-to: type=gha,mode=max,scope=${{ matrix.worker }}

